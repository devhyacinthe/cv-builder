name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; la dernière version poussée gagne.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vérification TypeScript
        run: npm run typecheck

      - name: Génération du site statique
        run: npm run generate
        env:
          # Le site est servi depuis https://<compte>.github.io/<dépôt>/
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/

      # Requiert Pages activé une fois à la main :
      # Settings → Pages → Source : GitHub Actions.
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
